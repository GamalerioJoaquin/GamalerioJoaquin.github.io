<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Facial landmark map</title>
  <desc id="desc">Stylized 68-point facial landmark grid for biometric analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0a1c2c"/>
      <stop offset="1" stop-color="#101a35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#59e1d2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#59e1d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ba7ff" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="640" rx="28" fill="url(#bg)"/>
  <rect width="960" height="640" rx="28" fill="url(#grid)"/>
  <ellipse cx="505" cy="318" rx="280" ry="286" fill="url(#halo)"/>

